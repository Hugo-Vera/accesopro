# AccesoPro detrás de Nginx (Laragon)
# Browser accesopro.test:8084 → Next :3080 (basePath /accesopro)
#
# El :3000 de esta PC suele ser GenieACS; AccesoPro web local usa :3080.

server {
    listen 8084;
    server_name accesopro.test *.accesopro.test;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 8084;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;

    location = / {
        return 302 /accesopro/;
    }

    location /accesopro/api/events/stream {
        proxy_pass http://127.0.0.1:3080;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
    }
}
