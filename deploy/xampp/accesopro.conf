# AccesoPro detrás de Apache (XAMPP)
# Browser :3080 → Next :3000 → API :8787

Listen 3080

<VirtualHost *:3080>
  ServerName localhost
  ServerAlias accesopro.local

  ProxyPreserveHost On
  ProxyRequests Off
  ProxyTimeout 3600

  RequestHeader set X-Forwarded-Proto "http"
  RequestHeader set X-Forwarded-Port "3080"

  # SSE: sin buffer (toast / eventos en vivo)
  <LocationMatch "^/api/events/stream">
    SetEnv proxy-sendchunked 1
    SetEnv proxy-nokeepalive 1
    ProxyPass http://127.0.0.1:3000/api/events/stream flushpackets=on
    ProxyPassReverse http://127.0.0.1:3000/api/events/stream
  </LocationMatch>

  ProxyPass        / http://127.0.0.1:3000/
  ProxyPassReverse / http://127.0.0.1:3000/

  ErrorLog "logs/accesopro-error.log"
  CustomLog "logs/accesopro-access.log" common
</VirtualHost>
