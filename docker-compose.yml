# AccesoPro — stack Docker optimizado
#
# Core (dashboard + API):     docker compose up -d --build
# + Agent Dahua real:         docker compose --profile dahua up -d --build
# + Motor ALPR:               docker compose --profile alpr up -d --build
# Todo:                       docker compose --profile alpr --profile dahua up -d --build
#
# Preferí:  powershell -File scripts\start-server.ps1 -Profile dahua

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      HOST: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion-docker}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SITE_ENGINE_URL: ${SITE_ENGINE_URL:-http://site:5051}
      SITE_ENGINE_USER: ${SITE_ENGINE_USER:-admin}
      SITE_ENGINE_PASSWORD: ${SITE_ENGINE_PASSWORD:-admin}
      ACCESOPRO_BRIDGE_KEY: ${ACCESOPRO_BRIDGE_KEY:-accesopro-bridge}
      ENGINE_BRIDGE_POLL_MS: ${ENGINE_BRIDGE_POLL_MS:-5000}
      SITE_AGENT_URL: ${SITE_AGENT_URL:-http://agent:8790}
      SITE_AGENT_TOKEN: ${SITE_AGENT_TOKEN:-accesopro-demo-agent}
      ACCESOPRO_ALLOW_SELF_UPDATE: ${ACCESOPRO_ALLOW_SELF_UPDATE:-1}
      ACCESOPRO_HOST_DIR: /host/accesopro
      ACCESOPRO_HOST_PATH: ${ACCESOPRO_HOST_DIR:-/opt/accesopro}
      ACCESOPRO_OWNER: ${ACCESOPRO_OWNER:-}
      ACCESOPRO_REPO: ${ACCESOPRO_REPO:-Hugo-Vera/accesopro}
      ACCESOPRO_BRANCH: ${ACCESOPRO_BRANCH:-master}
    volumes:
      - api_data:/app/apps/api/data
      # Self-update desde el dashboard (Ubuntu). En Windows Desktop puede fallar el socket: poné ALLOW=0.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ACCESOPRO_HOST_DIR:-/opt/accesopro}:/host/accesopro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser → mismo origen (:3000); Next reescribe a la API del compose
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_MAP_PROVIDER: ${NEXT_PUBLIC_MAP_PROVIDER:-osm}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_TYPE: ${NEXT_PUBLIC_GOOGLE_MAPS_TYPE:-hybrid}
        API_INTERNAL_URL: http://api:8787
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      API_INTERNAL_URL: http://api:8787
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
    restart: unless-stopped

  postgres:
    profiles: [alpr]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastalpr
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastalpr"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  site:
    profiles: [alpr]
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    ports:
      - "5051:5051"
    environment:
      ACCESOPRO_API_URL: http://api:8787
      ACCESOPRO_BRIDGE_KEY: ${ACCESOPRO_BRIDGE_KEY:-accesopro-bridge}
    volumes:
      - ./deploy/site.config.docker.yaml:/app/config.yaml:ro
      - site_evidencia:/app/evidencia
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    # ALPR consume CPU; limitar evita matar el host
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
    restart: unless-stopped

  agent:
    profiles: [dahua]
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    ports:
      - "8790:8790"
    environment:
      ACCESOPRO_API_URL: http://api:8787
      SITE_AGENT_TOKEN: ${SITE_AGENT_TOKEN:-accesopro-demo-agent}
      UVICORN_WORKERS: "1"
      # Live: ffmpeg recode del extra RTSP. Bajar FPS si el NUC se pone pesado.
      AGENT_LIVE_FPS: ${AGENT_LIVE_FPS:-12}
      AGENT_LIVE_JPEG_QUALITY: ${AGENT_LIVE_JPEG_QUALITY:-52}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  api_data:
  site_evidencia:
